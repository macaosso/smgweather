<!DOCTYPE html>
<html lang="zh-Hant" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>澳門氣象 - WBGT 暑熱即時推播監測</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            slate: {
              850: '#0f172a',
              900: '#0b1120',
              950: '#050811'
            }
          }
        }
      }
    }
  </script>

  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Plus Jakarta Sans', 'Noto Sans TC', system-ui, -apple-system, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    .font-mono-num {
      font-family: 'JetBrains Mono', monospace;
    }
  </style>
</head>
<body class="min-h-full bg-slate-900 text-slate-100 flex flex-col antialiased selection:bg-amber-500 selection:text-slate-950">

  <!-- Header -->
  <header class="border-b border-slate-800 bg-slate-950/70 backdrop-blur-md sticky top-0 z-20">
    <div class="max-w-4xl mx-auto px-4 h-14 flex items-center justify-between">
      <div class="flex items-center gap-2.5">
        <div class="w-8 h-8 rounded-lg bg-amber-500/20 text-amber-400 flex items-center justify-center border border-amber-500/30">
          <i class="fa-solid fa-triangle-exclamation text-sm"></i>
        </div>
        <div>
          <h1 class="text-sm font-bold text-white flex items-center gap-2">
            <span>WBGT 暑熱即時推播</span>
            <span class="text-[10px] px-1.5 py-0.5 rounded bg-amber-500/15 text-amber-400 border border-amber-500/30 font-mono-num">≥ 28°C ALERT</span>
          </h1>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <button id="btnNotifyPermission" onclick="requestPermission()" class="px-3 py-1.5 text-xs font-bold rounded-xl bg-amber-500 hover:bg-amber-400 active:scale-95 text-slate-950 transition flex items-center gap-1.5 shadow-lg shadow-amber-500/20">
          <i class="fa-solid fa-bell"></i>
          <span id="btnPermissionText">啟用通知權限</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Monitor Panel -->
  <main class="flex-1 max-w-4xl w-full mx-auto p-4 sm:p-6 space-y-5">
    
    <!-- Status Overview Card -->
    <div class="bg-slate-850 border border-slate-800 rounded-2xl p-4 sm:p-5 shadow-xl space-y-4">
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 border-b border-slate-800 pb-3">
        <div class="flex items-center gap-2">
          <span class="relative flex h-2.5 w-2.5">
            <span id="pingPulse" class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
            <span id="pingDot" class="relative inline-flex rounded-full h-2.5 w-2.5 bg-emerald-500"></span>
          </span>
          <span id="monitorStatusText" class="text-xs font-semibold text-slate-300">監聽輪詢中 (每 60 秒檢查一次)</span>
        </div>
        <div class="text-[11px] text-slate-400 font-mono-num">
          最後更新：<span id="lastCheckTime" class="text-slate-200">--:--:--</span>
        </div>
      </div>

      <!-- Trigger Rules and Notification Counter -->
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 font-mono-num">
        <div class="bg-slate-900/80 border border-slate-800 p-3 rounded-xl">
          <div class="text-[10px] font-sans text-slate-400">觸發條件</div>
          <div class="text-sm font-bold text-amber-400 mt-1">WBGT ≥ 28.0 °C</div>
          <div class="text-[10px] font-sans text-slate-500 mt-0.5">無去重模式 (更新即彈窗)</div>
        </div>

        <div class="bg-slate-900/80 border border-slate-800 p-3 rounded-xl">
          <div class="text-[10px] font-sans text-slate-400">已推播次數</div>
          <div id="notifiedCount" class="text-lg font-extrabold text-white mt-0.5">0</div>
          <div class="text-[10px] font-sans text-slate-500 mt-0.5">每次資料有新版且達標時發送</div>
        </div>

        <div class="bg-slate-900/80 border border-slate-800 p-3 rounded-xl">
          <div class="text-[10px] font-sans text-slate-400">當前達標測站數</div>
          <div id="triggeredStationsCount" class="text-lg font-extrabold text-slate-400 mt-0.5">0 站</div>
          <div class="text-[10px] font-sans text-slate-500 mt-0.5">即時統計</div>
        </div>
      </div>

      <!-- Action buttons -->
      <div class="flex items-center gap-2 pt-1">
        <button onclick="fetchAndCheck(true)" class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 active:scale-95 text-xs font-bold text-slate-200 border border-slate-700 transition flex items-center gap-1.5">
          <i class="fa-solid fa-rotate" id="refreshIcon"></i>
          <span>手動即刻檢查</span>
        </button>
        <button onclick="sendTestNotification()" class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 active:scale-95 text-xs font-bold text-slate-300 border border-slate-700 transition flex items-center gap-1.5">
          <i class="fa-solid fa-paper-plane text-sky-400"></i>
          <span>測試推播彈窗</span>
        </button>
      </div>
    </div>

    <!-- Station WBGT Grid -->
    <div class="space-y-2">
      <div class="flex items-center justify-between px-1">
        <h2 class="text-xs font-bold text-slate-300 flex items-center gap-1.5">
          <i class="fa-solid fa-tower-broadcast text-slate-400"></i>
          各站實時 WBGT 暑熱指數
        </h2>
        <span class="text-[10px] text-slate-500 font-mono-num">≥ 28°C 即時高亮並通知</span>
      </div>

      <div id="stationGrid" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-2.5">
        <!-- Rendered by JS -->
      </div>
    </div>

    <!-- Real-time Trigger Event Log -->
    <div class="bg-slate-850 border border-slate-800 rounded-2xl p-4 shadow-xl space-y-2.5">
      <div class="flex items-center justify-between pb-2 border-b border-slate-800">
        <span class="text-xs font-bold text-slate-300 flex items-center gap-1.5">
          <i class="fa-solid fa-list-check text-slate-400"></i>
          推播發送日誌 (Log)
        </span>
        <button onclick="clearLogs()" class="text-[10px] text-slate-500 hover:text-slate-300 transition">清空日誌</button>
      </div>

      <div id="logContainer" class="font-mono text-[11px] space-y-1.5 max-h-48 overflow-y-auto pr-1">
        <div class="text-slate-500 py-1">系統初始化中，等待更新...</div>
      </div>
    </div>

  </main>

  <script>
    // 測站列表與屬性定義
    const STATIONS = [
      { name: "紀念孫中山公園", isBridge: false },
      { name: "黑沙環",         isBridge: false },
      { name: "大炮台",         isBridge: false },
      { name: "外港碼頭",       isBridge: false },
      { name: "媽閣",           isBridge: false },
      { name: "大潭山",         isBridge: false },
      { name: "東亞運大馬路",   isBridge: false },
      { name: "澳門大學",       isBridge: false },
      { name: "九澳",           isBridge: false },
      { name: "路環",           isBridge: false },
      { name: "友誼大橋北",     isBridge: true },
      { name: "友誼大橋南",     isBridge: true },
      { name: "澳門大橋北",     isBridge: true },
      { name: "澳門大橋南",     isBridge: true },
      { name: "嘉樂庇總督大橋", isBridge: true },
      { name: "西灣大橋",       isBridge: true },
      { name: "蓮花大橋",       isBridge: true }
    ];

    let lastKnownSysPubdate = null; // 紀錄前一次資料更新時間
    let notificationCount = 0;
    const POLL_INTERVAL_MS = 60 * 1000; // 每 60 秒輪詢一次

    // WBGT 算法 (當 JSON 未直接提供 WBGT 時估算)
    function estimate_wbgt(ta, rh, w, uvi = 0.0) {
      if (ta === null || rh === null || w === null || isNaN(ta) || isNaN(rh) || isNaN(w)) return null;
      try {
        const uvi_val = (uvi === null || isNaN(uvi)) ? 0.0 : parseFloat(uvi);
        const rh_sqrt = Math.sqrt(rh + 8.313659);
        const twb = (ta * Math.atan(0.151977 * rh_sqrt)
               + Math.atan(ta + rh)
               - Math.atan(rh - 1.676331)
               + 0.00391838 * Math.pow(rh, 1.5) * Math.atan(0.023101 * rh)
               - 4.686035);
        const tg = ta + (1.404 * uvi_val) - (0.111 * w);
        const wbgt = 0.7 * twb + 0.2 * tg + 0.1 * ta;
        return parseFloat(wbgt.toFixed(1));
      } catch (e) {
        return null;
      }
    }

    // 請求通知權限
    async function requestPermission() {
      if (!("Notification" in window)) {
        alert("此瀏覽器不支援 Web Notification");
        return;
      }
      const res = await Notification.requestPermission();
      updatePermissionUi();
      if (res === "granted") {
        addLog("已取得瀏覽器通知權限");
      }
    }

    function updatePermissionUi() {
      const btn = document.getElementById("btnNotifyPermission");
      const text = document.getElementById("btnPermissionText");
      if (!("Notification" in window)) {
        text.innerText = "不支援通知";
        btn.className = "px-3 py-1.5 text-xs font-bold rounded-xl bg-slate-800 text-slate-500 cursor-not-allowed";
        return;
      }

      if (Notification.permission === "granted") {
        text.innerText = "通知已啟用";
        btn.className = "px-3 py-1.5 text-xs font-bold rounded-xl bg-emerald-500/15 text-emerald-400 border border-emerald-500/30 cursor-default flex items-center gap-1.5";
        btn.innerHTML = `<i class="fa-solid fa-check"></i><span>通知已啟用</span>`;
        btn.onclick = null;
      } else if (Notification.permission === "denied") {
        text.innerText = "通知已被封鎖";
        btn.className = "px-3 py-1.5 text-xs font-bold rounded-xl bg-rose-500/15 text-rose-400 border border-rose-500/30 flex items-center gap-1.5";
        btn.innerHTML = `<i class="fa-solid fa-bell-slash"></i><span>已封鎖 (請至設定開啟)</span>`;
      }
    }

    // 發送通知 (不進行去重：只要資料更新且有站點 >= 28，立刻發送)
    function triggerNotification(triggeredList, updateTime) {
      notificationCount++;
      document.getElementById("notifiedCount").innerText = notificationCount;

      const title = `⚠️ 暑熱警報：全澳 ${triggeredList.length} 站 WBGT ≥ 28°C`;
      const bodyLines = triggeredList.slice(0, 5).map(s => `• ${s.name}: ${s.wbgt}°C`);
      if (triggeredList.length > 5) {
        bodyLines.push(`...及其他 ${triggeredList.length - 5} 處測站`);
      }
      bodyLines.push(`更新時間：${updateTime || new Date().toLocaleTimeString()}`);

      const bodyText = bodyLines.join("\n");

      // 檢查是否具有 ServiceWorker
      if (navigator.serviceWorker && navigator.serviceWorker.controller) {
        navigator.serviceWorker.ready.then(reg => {
          reg.showNotification(title, {
            body: bodyText,
            icon: "https://cdn-icons-png.flaticon.com/512/1146/1146869.png",
            tag: "wbgt-alert-" + Date.now(), // 每次彈出新通知，不去重覆蓋
            renotify: true
          });
        });
      } else if (Notification.permission === "granted") {
        const notif = new Notification(title, {
          body: bodyText,
          icon: "https://cdn-icons-png.flaticon.com/512/1146/1146869.png"
        });
        notif.onclick = () => {
          window.focus();
          notif.close();
        };
      }

      addLog(`[推播發送] ${title} (${updateTime})`, "text-amber-400");
    }

    function sendTestNotification() {
      if (Notification.permission !== "granted") {
        alert("請先點擊上方按鈕允許通知權限！");
        return;
      }
      triggerNotification([
        { name: "大潭山", wbgt: 29.4 },
        { name: "黑沙環", wbgt: 28.5 }
      ], "手動測試");
    }

    // 核心拉取與檢查流程
    async function fetchAndCheck(isManual = false) {
      const refreshIcon = document.getElementById("refreshIcon");
      if (refreshIcon) refreshIcon.classList.add("fa-spin");

      try {
        const res = await fetch(`weather_data.json?t=${Date.now()}`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();

        const currentUpdateTime = data.update_time || data.syspubdate || null;
        document.getElementById("lastCheckTime").innerText = new Date().toLocaleTimeString();

        // 判斷資料是否有更新 (第一次載入直接比對並記錄)
        const isDataUpdated = (currentUpdateTime !== null && currentUpdateTime !== lastKnownSysPubdate);

        const stationsData = data.stations || {};
        const triggered = [];

        // 逐站計算並渲染
        const gridHtml = STATIONS.map(st => {
          if (st.isBridge) return ''; // 跨海大橋通常無 WBGT，跳過卡片
          const d = stationsData[st.name] || {};
          let val = d.wbgt;
          if (val === undefined || val === null) {
            val = estimate_wbgt(d.temp_now, d.humidity, d.wind_speed);
          }

          const hasVal = (val !== null && val !== undefined && !isNaN(val));
          const numVal = hasVal ? parseFloat(val) : null;
          const isTriggered = (numVal !== null && numVal >= 28.0);

          if (isTriggered) {
            triggered.push({ name: st.name, wbgt: numVal });
          }

          let badgeStyle = "bg-slate-900 border-slate-800 text-slate-300";
          let numColor = "text-slate-400";

          if (isTriggered) {
            badgeStyle = "bg-amber-500/10 border-amber-500/40 text-amber-300 shadow-lg shadow-amber-500/10";
            numColor = "text-amber-400";
          }

          return `
            <div class="border rounded-xl p-2.5 transition flex items-center justify-between font-mono-num ${badgeStyle}">
              <div>
                <div class="font-sans font-bold text-xs text-white">${st.name}</div>
                <div class="text-[10px] text-slate-500 font-sans mt-0.5">WBGT</div>
              </div>
              <div class="text-right">
                <div class="text-base font-extrabold ${numColor}">${hasVal ? numVal + '°' : '--'}</div>
                <div class="text-[9px] ${isTriggered ? 'text-amber-400 font-bold' : 'text-slate-500'} font-sans">
                  ${isTriggered ? '≥28 達標' : '未達標'}
                </div>
              </div>
            </div>
          `;
        }).join('');

        document.getElementById("stationGrid").innerHTML = gridHtml;
        document.getElementById("triggeredStationsCount").innerText = `${triggered.length} 站`;

        // 【關鍵條件】：資料有新時間戳 (或手動觸發)，且任一站點 WBGT >= 28
        if (isDataUpdated || isManual) {
          if (isDataUpdated) {
            lastKnownSysPubdate = currentUpdateTime;
            addLog(`[資料更新] 偵測到新時間戳：${currentUpdateTime}`);
          }

          if (triggered.length > 0) {
            triggerNotification(triggered, currentUpdateTime);
          } else {
            addLog(`[檢查通過] 全澳所有站點 WBGT 皆低於 28°C`);
          }
        }

      } catch (err) {
        addLog(`[連線錯誤] 無法取得 weather_data.json: ${err.message}`, "text-rose-400");
      } finally {
        if (refreshIcon) refreshIcon.classList.remove("fa-spin");
      }
    }

    function addLog(msg, colorClass = "text-slate-400") {
      const container = document.getElementById("logContainer");
      const timeStr = new Date().toLocaleTimeString();
      const div = document.createElement("div");
      div.className = `${colorClass} py-0.5`;
      div.innerHTML = `<span class="text-slate-600">[${timeStr}]</span> ${msg}`;
      container.prepend(div);
    }

    function clearLogs() {
      document.getElementById("logContainer").innerHTML = '<div class="text-slate-500 py-1">日誌已清空</div>';
    }

    // 初始化與定時輪詢
    window.addEventListener("load", () => {
      updatePermissionUi();
      fetchAndCheck(true); // 首次載入立即檢查一次
      setInterval(() => {
        fetchAndCheck(false);
      }, POLL_INTERVAL_MS);
    });
  </script>
</body>
</html>
