name: Macau Weather Auto Sync & Render

on:
  schedule:
    # 建議每 15-20 分鐘定時執行一次（GitHub Actions 支援的最穩週期）
    - cron: '*/20 * * * *'
  workflow_dispatch: # 支援手動立即點擊執行

env:
  TZ: Asia/Macau

# 同一時間只允許一個任務執行，舊排隊任務自動取消，徹底杜絕佇列堆疊
concurrency:
  group: weather-sync-pages
  cancel-in-progress: true

# 授予發布 GitHub Pages 與寫入數據分支的必要權限
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 檢出代碼庫
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 配置 Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安裝中文字體與系統底層依賴
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk fonts-wqy-zenhei fonts-wqy-microhei fontconfig libgdal-dev libgeos-dev libproj-dev
          fc-cache -fv
          rm -rf ~/.cache/matplotlib

      - name: 安裝 uv 與 Python 核心庫
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          uv pip install --system requests pandas numpy matplotlib geopandas osmnx

      - name: 拉取歷史 SQLite 數據庫維持時序
        run: |
          mkdir -p /tmp/data-fetch
          if git clone --depth 1 --branch data-storage "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" /tmp/data-fetch 2>/dev/null; then
            cp -f /tmp/data-fetch/history.db ./history.db 2>/dev/null || true
            cp -rf /tmp/data-fetch/cache ./ 2>/dev/null || true
            rm -rf /tmp/data-fetch
          fi

      - name: 執行 Python 核心氣象抓取與渲染
        run: |
          python app.py

      - name: 備份 SQLite 與快取至獨立數據分支
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          rm -rf /tmp/data-save
          mkdir -p /tmp/data-save
          cp -f history.db /tmp/data-save/ 2>/dev/null || true
          cp -rf cache /tmp/data-save/ 2>/dev/null || true
          
          cd /tmp/data-save
          git init
          git checkout -b data-storage
          git add -A
          git commit -m "Update DB [$(date '+%Y-%m-%d %H:%M:%S')]" || true
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" data-storage || true
          cd "$GITHUB_WORKSPACE"

      - name: 準備發布目錄 (打包 HTML、數據與靜態圖檔)
        run: |
          mkdir -p ./public/static/images
          cp -f index.html ./public/
          cp -f weather_data.json ./public/ 2>/dev/null || true
          cp -f static/images/rainfall_24h_summary.json ./public/ 2>/dev/null || true
          cp -f history.db ./public/ 2>/dev/null || true
          cp -rf static/images/* ./public/static/images/ 2>/dev/null || true

      - name: 設定 GitHub Pages 環境
        uses: actions/configure-pages@v5

      - name: 上傳靜態網頁成果 (Upload Artifact)
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public'

      - name: 部署至 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
