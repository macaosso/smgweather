name: Macau Weather Auto Sync & Render

on:
  schedule:
    # 每天定時觸發守護流程（每 5 小時觸發一次輪轉）
    - cron: '0 */5 * * *'
  workflow_dispatch: # 支援在 GitHub 介面手動立即觸發

env:
  TZ: Asia/Macau

# 避免多個工作流同時推送產生衝突
concurrency:
  group: weather-render-sync
  cancel-in-progress: true

jobs:
  weather-loop:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: 檢出主分支代碼 (僅最新版本)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 配置 Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安裝中文字體與字型系統依賴
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk fonts-wqy-zenhei fonts-wqy-microhei fontconfig
          fc-cache -fv
          rm -rf ~/.cache/matplotlib

      - name: 安裝 uv 極速套件管理器
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: 極速安裝 Python 核心庫
        run: |
          uv pip install --system requests pandas numpy matplotlib geopandas osmnx

      - name: 執行 4.5 小時常駐循環 (每 5 分鐘抓取更新一次)
        run: |
          END_TIME=$(($(date +%s) + 16200))
          INTERVAL=300 # 每 300 秒 (5 分鐘) 執行一次

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          while [ $(date +%s) -lt $END_TIME ]; do
            echo "=========================================================="
            echo "[$(date '+%Y-%m-%d %H:%M:%S')] 開始執行澳門氣象同步輪詢..."
            echo "=========================================================="

            # 淺層拉取遠端 gh-pages 分支的最新歷史數據庫，維持時序連續性
            rm -rf /tmp/gh-pages-fetch
            if git clone --depth 1 --branch gh-pages "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" /tmp/gh-pages-fetch 2>/dev/null; then
              cp -f /tmp/gh-pages-fetch/history.db ./history.db 2>/dev/null || true
              cp -rf /tmp/gh-pages-fetch/cache ./ 2>/dev/null || true
              rm -rf /tmp/gh-pages-fetch
            fi

            # 執行 Python 核心腳本生成圖檔與數據
            python app.py || echo "本輪抓取或渲染發生異常，跳過等待下輪..."

            # 準備發布到 gh-pages (獨立乾淨目錄，不累積深層歷史)
            echo "準備同步發布至 gh-pages..."
            rm -rf /tmp/gh-pages-deploy
            mkdir -p /tmp/gh-pages-deploy

            # 複製最新生成產物
            mkdir -p /tmp/gh-pages-deploy/static/images
            mkdir -p /tmp/gh-pages-deploy/cache

            cp -f index.html /tmp/gh-pages-deploy/ 2>/dev/null || true
            cp -rf static/images/* /tmp/gh-pages-deploy/static/images/ 2>/dev/null || true
            cp -f weather_data.json /tmp/gh-pages-deploy/ 2>/dev/null || true
            cp -f rainfall_24h_summary.json /tmp/gh-pages-deploy/ 2>/dev/null || true
            cp -f history.db /tmp/gh-pages-deploy/ 2>/dev/null || true
            cp -rf cache/* /tmp/gh-pages-deploy/cache/ 2>/dev/null || true

            cd /tmp/gh-pages-deploy
            git init
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git checkout -b gh-pages
            git add -A
            git commit -m "Auto Update: $(date '+%Y-%m-%d %H:%M:%S') [Macau SMG Sync]"
            
            # 強制覆蓋推送單一最新 commit 到 gh-pages，確保 gh-pages 永遠只有 1 次提交的體積，徹底解決體積膨脹
            git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages || echo "推送失敗，等待下輪重試..."

            cd "$GITHUB_WORKSPACE"
            rm -rf /tmp/gh-pages-deploy

            echo "等待 5 分鐘進行下一輪監控..."
            sleep $INTERVAL
          done

          echo "本次 4.5 小時守護任務即將結束，觸發下一個任務交接..."

      - name: 自動重啟下一次工作流 (Self-Renewal Handoff)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "觸發後續週期工作流..."
          gh workflow run update.yml --ref main || echo "自動觸發結束。"
