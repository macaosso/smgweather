name: Macau Weather Auto Sync & Render

on:
  schedule:
    - cron: '0 */5 * * *'
  workflow_dispatch:

env:
  TZ: Asia/Macau

concurrency:
  group: weather-render-sync
  cancel-in-progress: true

jobs:
  weather-loop:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: 檢出主分支代碼
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 配置 Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安裝系統地理庫與中文字體依賴
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk fonts-wqy-zenhei fonts-wqy-microhei fontconfig \
                                  libgdal-dev libgeos-dev libspatialindex-dev
          fc-cache -fv
          rm -rf ~/.cache/matplotlib

      - name: 安裝 uv 極速套件管理器
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: 安裝 Python 核心庫
        run: |
          uv pip install --system requests pandas numpy matplotlib geopandas osmnx pillow

      - name: 執行 4.5 小時常駐循環 (每 5 分鐘抓取更新一次)
        run: |
          END_TIME=$(($(date +%s) + 16200))
          INTERVAL=300

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          while [ $(date +%s) -lt $END_TIME ]; do
            echo "=========================================================="
            echo "[$(date '+%Y-%m-%d %H:%M:%S')] 開始執行澳門氣象同步輪詢..."
            echo "=========================================================="

            cd "$GITHUB_WORKSPACE"

            # 1. 強制同步 main 分支最新代碼，避免使用啟動時的舊版 index.html / notify.html / app.py
            git fetch origin main
            git reset --hard origin/main

            # 2. 拉取 gh-pages 分支歷史資料庫，維持時序連續性
            rm -rf /tmp/gh-pages-fetch
            if git clone --depth 1 --branch gh-pages "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" /tmp/gh-pages-fetch 2>/dev/null; then
              cp -f /tmp/gh-pages-fetch/history.db ./history.db 2>/dev/null || true
              cp -rf /tmp/gh-pages-fetch/cache ./ 2>/dev/null || true
              rm -rf /tmp/gh-pages-fetch
            fi

            # 3. 確保目錄結構齊全
            mkdir -p static/images
            mkdir -p cache

            # 4. 執行核心 Python 腳本
            python app.py

            # 5. 準備發布到 gh-pages 目錄
            echo "準備同步發布至 gh-pages..."
            rm -rf /tmp/gh-pages-deploy
            mkdir -p /tmp/gh-pages-deploy/static/images
            mkdir -p /tmp/gh-pages-deploy/cache

            # 拷貝最新檔案 (確保 index.html 與 notify.html 為最新版本)
            cp -f index.html /tmp/gh-pages-deploy/ 2>/dev/null || true
            cp -f notify.html /tmp/gh-pages-deploy/ 2>/dev/null || true
            cp -rf static /tmp/gh-pages-deploy/ 2>/dev/null || true
            cp -f weather_data.json /tmp/gh-pages-deploy/ 2>/dev/null || true
            cp -f history.db /tmp/gh-pages-deploy/ 2>/dev/null || true
            cp -rf cache/* /tmp/gh-pages-deploy/cache/ 2>/dev/null || true

            # 同步 MSSO(H).png 到根目錄與 static/images 目錄
            cp -f "MSSO(H).png" /tmp/gh-pages-deploy/ 2>/dev/null || true
            cp -f "MSSO(H).png" /tmp/gh-pages-deploy/static/images/ 2>/dev/null || true
            cp -f static/images/"MSSO(H).png" /tmp/gh-pages-deploy/ 2>/dev/null || true

            # 額外防禦：若 JSON 在 static/images，拷貝一份到根目錄；反之亦然
            if [ -f static/images/rainfall_24h_summary.json ]; then
              cp -f static/images/rainfall_24h_summary.json /tmp/gh-pages-deploy/rainfall_24h_summary.json 2>/dev/null || true
            elif [ -f rainfall_24h_summary.json ]; then
              cp -f rainfall_24h_summary.json /tmp/gh-pages-deploy/static/images/rainfall_24h_summary.json 2>/dev/null || true
            fi

            cd /tmp/gh-pages-deploy
            git init
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git checkout -b gh-pages
            git add -A

            # 列出本次 commit 包含的文件清單，方便在 Action 日誌中確認
            echo "--- gh-pages 發布檔案列表 ---"
            git status --short
            echo "----------------------------"

            git commit -m "Auto Update: $(date '+%Y-%m-%d %H:%M:%S') [Macau SMG Sync]"

            git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages || echo "推送失敗，等待下輪重試..."

            cd "$GITHUB_WORKSPACE"
            rm -rf /tmp/gh-pages-deploy

            echo "等待 5 分鐘進行下一輪監控..."
            sleep $INTERVAL
          done

      - name: 自動重啟下一次工作流 (Self-Renewal Handoff)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run update.yml --ref main || echo "自動觸發結束。"
