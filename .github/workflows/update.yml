name: Macau Weather Auto Sync & Render

on:
  schedule:
    # 兜底保險：若自我喚醒偶發失敗，每 5 小時依然會強制啟動一次
    - cron: '0 */5 * * *'
  workflow_dispatch:

env:
  TZ: Asia/Macau

concurrency:
  group: weather-render-sync
  cancel-in-progress: false   # 確保交接時不會中途取消正在清理的任務

jobs:
  weather-loop:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write           # 必須具備 actions: write 才能調用 API 觸發新 workflow

    steps:
      - name: 檢出主分支代碼
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 配置 Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安裝中文字體依賴
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-wqy-microhei fontconfig
          fc-cache -fv
          rm -rf ~/.cache/matplotlib

      - name: 安裝 uv 極速套件管理器
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: 安裝 Python 核心庫 (移除地圖重型依賴)
        run: |
          uv pip install --system requests pandas numpy matplotlib pillow

      - name: 執行 4.5 小時常駐循環 (每 1 分鐘抓取更新一次)
        run: |
          NOW=$(date +%s)
          END_TIME=$((NOW + 16200))
          INTERVAL=60
          IMG_NAME="MSSO(H).png"

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          while [ $(date +%s) -lt $END_TIME ]; do
            echo "=========================================================="
            echo "[$(date '+%Y-%m-%d %H:%M:%S')] 開始執行澳門氣象同步輪詢..."
            echo "=========================================================="

            cd "$GITHUB_WORKSPACE"

            # 1. 強制同步 main 分支最新代碼
            git fetch origin main
            git reset --hard origin/main

            # 2. 拉取 gh-pages 分支歷史資料庫，維持時序連續性
            rm -rf /tmp/gh-pages-fetch
            if git clone --depth 1 --branch gh-pages "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" /tmp/gh-pages-fetch 2>/dev/null; then
              cp -f /tmp/gh-pages-fetch/history.db ./history.db 2>/dev/null || true
              cp -f /tmp/gh-pages-fetch/windindex.db ./windindex.db 2>/dev/null || true
              rm -rf /tmp/gh-pages-fetch
            fi

            # 3. 確保目錄結構齊全
            mkdir -p static/images

            # 4. 執行核心 Python 腳本並攔截狀態碼
            set +e
            python app.py
            APP_STATUS=$?
            set -e

            # 若狀態碼為 2 (資料未更新)，跳過推送，直接等待下個 1 分鐘
            if [ $APP_STATUS -eq 2 ]; then
              echo "⏭️ 氣象數據未更新，跳過 gh-pages 發布，等待 1 分鐘..."
              sleep $INTERVAL
              continue
            elif [ $APP_STATUS -ne 0 ]; then
              echo "⚠️ 執行出現異常 (Exit Code: $APP_STATUS)，等待 1 分鐘後重試..."
              sleep $INTERVAL
              continue
            fi

            # 5. 檢測到新資料且繪圖成功，發布到 gh-pages (增量合併，避免覆蓋其他工作流)
            echo "準備同步發布至 gh-pages..."
            rm -rf /tmp/gh-pages-deploy

            REPO_URL="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"

            # 5.1 完整複製遠端 gh-pages 最新歷史（若分支不存在則初始化）
            if ! git clone --single-branch --branch gh-pages "$REPO_URL" /tmp/gh-pages-deploy 2>/dev/null; then
              mkdir -p /tmp/gh-pages-deploy
              cd /tmp/gh-pages-deploy
              git init
              git checkout -b gh-pages
            fi

            cd /tmp/gh-pages-deploy
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"

            # 5.2 僅覆蓋/增量更新此工作流負責的檔案，其餘檔案完整保留
            mkdir -p static/images

            cp -f "$GITHUB_WORKSPACE/index.html" ./ 2>/dev/null || true
            cp -f "$GITHUB_WORKSPACE/notify.html" ./ 2>/dev/null || true
            cp -f "$GITHUB_WORKSPACE/sw.js" ./ 2>/dev/null || true
            cp -rf "$GITHUB_WORKSPACE/static/." ./static/ 2>/dev/null || true

            cp -f "$GITHUB_WORKSPACE/weather_data.json" ./ 2>/dev/null || true
            cp -f "$GITHUB_WORKSPACE/history.db" ./ 2>/dev/null || true
            cp -f "$GITHUB_WORKSPACE/windindex.db" ./ 2>/dev/null || true
            cp -f "$GITHUB_WORKSPACE/windindexdata.json" ./ 2>/dev/null || true

            cp -f "$GITHUB_WORKSPACE/$IMG_NAME" ./ 2>/dev/null || true
            cp -f "$GITHUB_WORKSPACE/$IMG_NAME" ./static/images/ 2>/dev/null || true

            if [ -f "$GITHUB_WORKSPACE/static/images/rainfall_24h_summary.json" ]; then
              cp -f "$GITHUB_WORKSPACE/static/images/rainfall_24h_summary.json" ./rainfall_24h_summary.json 2>/dev/null || true
            fi

            # 5.3 檢查是否有實際變更
            git add -A
            if git diff-index --quiet HEAD 2>/dev/null; then
              echo "檔案無實質變更，跳過本次提交。"
            else
              git commit -m "Auto Update: $(date '+%Y-%m-%d %H:%M:%S') [Macau SMG Sync]"

              # 5.4 拉取遠端最新變更 (rebase) 並重試推送，防止併發衝突
              PUSH_SUCCESS=false
              for retry in 1 2 3; do
                git pull --rebase origin gh-pages 2>/dev/null || true
                if git push "$REPO_URL" gh-pages; then
                  PUSH_SUCCESS=true
                  break
                fi
                echo "⚠️ 推送衝突或失敗，等待 3 秒進行第 $retry 次重試..."
                sleep 3
              done

              if [ "$PUSH_SUCCESS" = false ]; then
                echo "❌ 經過 3 次嘗試仍未能成功推送，將於下個週期繼續同步。"
              fi
            fi

            cd "$GITHUB_WORKSPACE"
            rm -rf /tmp/gh-pages-deploy

            echo "更新流程完畢，等待 1 分鐘進行下一輪監控..."
            sleep $INTERVAL
          done

      - name: 4.5 小時結束，無縫喚醒下一個任務
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "4.5 小時輪詢週期結束，正在無縫觸發新一輪同步與繪圖任務..."
          gh workflow run "Macau Weather Auto Sync & Render" --ref main || echo "觸發失敗，將由定時 cron 兜底喚醒。"
