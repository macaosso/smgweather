name: Macau Tide Auto Sync & Render

on:
  schedule:
    - cron: '15 */5 * * *'
  workflow_dispatch:

env:
  TZ: Asia/Macau

concurrency:
  group: tide-render-sync
  cancel-in-progress: false

jobs:
  tide-loop:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: 檢出主分支代碼
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 配置 Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安裝中文字體依賴
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-wqy-microhei fontconfig
          fc-cache -fv
          rm -rf ~/.cache/matplotlib

      - name: 安裝 uv 極速套件管理器
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: 安裝 Python 核心庫
        run: |
          uv pip install --system requests pandas numpy matplotlib

      - name: 執行 4.5 小時常駐循環 (每 1 分鐘抓取更新一次)
        run: |
          NOW=$(date +%s)
          END_TIME=$((NOW + 16200))
          INTERVAL=60

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          while [ $(date +\%s) -lt$END_TIME ]; do
            echo "=========================================================="
            echo "[$(date '+%Y-%m-%d %H:%M:%S')] 開始執行 DSAMA 實時潮汐同步..."
            echo "=========================================================="

            cd "$GITHUB_WORKSPACE"

            # 1. 同步最新 main 分支代碼
            git fetch origin main
            git reset --hard origin/main

            # 2. 拉取 gh-pages 分支歷史資料庫，維持時序連續性
            mkdir -p flood/images
            rm -rf /tmp/gh-pages-tide-fetch
            if git clone --depth 1 --branch gh-pages "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" /tmp/gh-pages-tide-fetch 2>/dev/null; then
              cp -f /tmp/gh-pages-tide-fetch/flood/tidehistory.db ./flood/tidehistory.db 2>/dev/null || true
              rm -rf /tmp/gh-pages-tide-fetch
            fi

            # 3. 執行潮汐核心腳本
            set +e
            python tide_app.py
            APP_STATUS=$?
            set -e

            if [ $APP_STATUS -eq 2 ]; then
              echo "⏭️ 潮汐數據未推進，跳過 gh-pages 發布，等待 1 分鐘..."
              sleep $INTERVAL
              continue
            elif [ $APP_STATUS -ne 0 ]; then
              echo "⚠️ 潮汐同步異常 (Exit Code: $APP_STATUS)，等待 1 分鐘後重試..."
              sleep $INTERVAL
              continue
            fi

            # 4. 同步更新發布至 gh-pages
            echo "準備同步潮汐檔案至 gh-pages..."
            rm -rf /tmp/gh-pages-deploy
